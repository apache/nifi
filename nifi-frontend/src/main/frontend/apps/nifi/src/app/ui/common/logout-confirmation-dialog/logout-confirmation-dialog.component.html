<div class="logout-heading">
    <h2 mat-dialog-title id="logout-confirm-title">Logout</h2>
    <button type="button" mat-icon-button [mat-dialog-close]="false" aria-label="Cancel logout">
        <i class="fa fa-times" aria-hidden="true"></i>
    </button>
</div>
<mat-dialog-content id="logout-confirm-message">
    <p>You are about to log out of Apache NiFi.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button id="logout-cancel" type="button" mat-stroked-button [mat-dialog-close]="false">Cancel</button>
    <button type="button" mat-flat-button [mat-dialog-close]="true">Confirm</button>
</mat-dialog-actions>
