<header class="nifi-header">
    <navigation>
        @if (canvasPermissions$ | async; as canvasPermissions) {
            @let dragging = (dragging$ | async) ?? false;
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-processor"
                iconHoverClass="icon-processor-add"
                tooltip="Processor"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.Processor, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-port-in"
                iconHoverClass="icon-port-in-add"
                tooltip="Input Port"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.InputPort, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-port-out"
                iconHoverClass="icon-port-out-add"
                tooltip="Output Port"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.OutputPort, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-group"
                iconHoverClass="icon-group-add"
                tooltip="Process Group"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.ProcessGroup, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-group-remote"
                iconHoverClass="icon-group-remote-add"
                tooltip="Remote Process Group"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.RemoteProcessGroup, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-funnel"
                iconHoverClass="icon-funnel-add"
                tooltip="Funnel"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.Funnel, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-import-from-registry"
                iconHoverClass="icon-import-from-registry-add"
                tooltip="Import from Registry"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.Flow, $event)"></new-canvas-item>
            <new-canvas-item
                [disabled]="!canvasPermissions.canWrite"
                [dragging]="dragging"
                iconClass="icon-label"
                iconHoverClass="icon-label-add"
                tooltip="Label"
                (dragStarted)="onDragStarted()"
                (dragEnded)="onDragEnded(ComponentType.Label, $event)"></new-canvas-item>
        }
    </navigation>
    <flow-status
        [flowAnalysisOpen]="(flowAnalysisOpen$ | async)!"
        [controllerStatus]="(controllerStatus$ | async)!"
        [lastRefreshed]="(lastRefreshed$ | async)!"
        [clusterSummary]="(clusterSummary$ | async)!"
        [bulletins]="(controllerBulletins$ | async)!"
        [currentProcessGroupId]="(currentProcessGroupId$ | async)!"
        [loadingStatus]="(loadingService.status$ | async)!"
        [flowAnalysisState]="(flowAnalysisState$ | async)!">
    </flow-status>
</header>
