<div class="caution-color-background p-4 flex flex-col gap-y-2">
    <div class="font-semibold">Deprecation Notice</div>
    @if (deprecationReason) {
        <div>{{ deprecationReason }}</div>
    } @else {
        <div>Please be aware this {{ fallbackNoun }} is deprecated and may be removed in the near future.</div>
    }
    @if (deprecationAlternatives) {
        <div>
            <div>See Alternatives</div>
            <see-also [extensionTypes]="deprecationAlternatives"></see-also>
        </div>
    }
</div>
