<div class="login-form">
    <h1>Sign in to NiFi Flow</h1>
    <p class="login-description">Use your NiFi account to continue.</p>
    <form [formGroup]="loginForm" (ngSubmit)="login()" [attr.aria-busy]="submitting()">
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" type="text" autocomplete="username" autofocus />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" autocomplete="current-password" />
        </mat-form-field>
        <button
            [disabled]="!loginForm.dirty || loginForm.invalid || loginForm.pending || submitting()"
            type="submit"
            mat-flat-button>
            {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </button>
    </form>
    @if (logoutSupported()) {
        <button type="button" mat-button (click)="logout()">Sign out of the current session</button>
    }
</div>
