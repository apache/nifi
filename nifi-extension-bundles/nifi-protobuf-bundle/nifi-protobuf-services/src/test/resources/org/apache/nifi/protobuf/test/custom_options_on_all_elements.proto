syntax = "proto2";
package example;

option java_package = "com.example.comprehensive";
option (custom.file_meta) = "docs";

message Wrapper {
  option (custom.message_meta) = true;

  optional int32 flag = 1 [(custom.field_meta) = "f"];

  oneof kind {
    option (custom.oneof_meta) = true;
    string text = 2 [(custom.oneof_field_meta) = "t"];
    int32 number = 3;
  }

  extensions 100 to 199 [(custom.extension_range_meta) = true];

  message Nested {
    extensions 200 to 299;
  }

  extend Nested {
    optional int32 nested_extra = 200 [(custom.nested_extend_field_meta) = "n"];
  }

  enum Color {
    option (custom.enum_meta) = true;
    RED = 0 [(custom.enum_value_meta) = "r"];
    GREEN = 1;
  }
}

extend Wrapper {
  optional int32 extra = 100 [(custom.extend_field_meta) = "e"];
}

message Request {
}

message Response {
}

service Catalog {
  option (custom.service_meta) = true;
  rpc Lookup (Request) returns (Response) {
    option (custom.method_meta) = true;
  }
}
