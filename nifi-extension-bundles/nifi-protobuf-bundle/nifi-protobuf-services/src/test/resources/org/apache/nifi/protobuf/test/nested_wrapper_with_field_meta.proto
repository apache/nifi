syntax = "proto3";
package example.sample;

message Wrapper {
  optional Payload previous = 1;
  optional Payload current = 2;
  Origin origin = 3;
  string operation = 4;
  optional int64 event_time = 5;
  optional chunk grouping = 6;

  message Payload {
    int64 record_id = 1;
    string display_name = 2;
    optional string code = 3;
    int32 flag_a = 4 [(confluent.field_meta) = {
      params: [
        {
          key: "connect.type",
          value: "int16"
        }
      ]
    }];
    optional int32 flag_b = 5 [(confluent.field_meta) = {
      params: [
        {
          key: "connect.type",
          value: "int16"
        }
      ]
    }];
    int32 flag_c = 6 [(confluent.field_meta) = {
      params: [
        {
          key: "connect.type",
          value: "int16"
        }
      ]
    }];
    string first_seen = 7;
    optional string last_editor = 8;
  }
  message Origin {
    string schema_version = 1;
    string producer = 2;
    int64 origin_time = 3;
    optional string mode = 4;
    string catalog = 5;
    optional string relation = 6;
  }
  message chunk {
    string grouping_id = 1;
    int64 sequence_a = 2;
    int64 sequence_b = 3;
  }
}
